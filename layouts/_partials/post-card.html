<article class="post-card">
  <a class="post-card-link" href="{{ .RelPermalink }}" aria-label="阅读：{{ .Title }}"></a>
  <div class="post-card-body">
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .GetTerms "categories" }}{{ range first 1 . }}<a class="category" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ end }}
    </div>
    <h2>{{ .Title }}</h2>
    <p>{{ .Summary | plainify | htmlUnescape | truncate 140 }}</p>
  </div>
</article>
