{{ with .Paginator }}
  {{ if gt .TotalPages 1 }}
  <nav class="pagination" aria-label="分页">
    {{ with .Prev }}<a href="{{ .URL }}" rel="prev">← 上一页</a>{{ else }}<span></span>{{ end }}
    <span>第 {{ .PageNumber }} / {{ .TotalPages }} 页</span>
    {{ with .Next }}<a href="{{ .URL }}" rel="next">下一页 →</a>{{ else }}<span></span>{{ end }}
  </nav>
  {{ end }}
{{ end }}
