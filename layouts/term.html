{{ define "main" }}
  <header class="page-header compact">
    <p class="eyebrow">{{ upper .Data.Singular }}</p>
    <h1>{{ .Title }}</h1>
    <p>{{ len .Pages }} 篇文章</p>
  </header>
  {{ $paginator := .Paginate .RegularPages.ByDate.Reverse }}
  <div class="post-list">
    {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </div>
  {{ partial "pagination.html" . }}
{{ end }}
