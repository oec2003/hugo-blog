{{ define "main" }}
  {{ $posts := where site.RegularPages.ByDate.Reverse "Section" "posts" }}
  {{ $paginator := .Paginate $posts }}
  <header class="home-feed-header">
    <h2>最近更新</h2>
    <a href="{{ "/archives/" | relURL }}">全部文章</a>
  </header>
  <div class="post-list">
    {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </div>
  {{ partial "pagination.html" . }}
{{ end }}
